name: IconsMenu

options:
  bundleIdPrefix: info.hudak.macos
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc signing: there is no Developer ID on this machine. Note that the
    # Accessibility grant is keyed to the code signature, so it must be re-granted
    # after most rebuilds. Swap in a real identity to stop that.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_HARDENED_RUNTIME: "NO"

targets:
  IconsMenu:
    type: application
    platform: macOS
    sources:
      - path: Sources/Core
      - path: Sources/IconsMenu
      # Generated by `make icon`, and committed. Optional so that project generation still
      # works on a checkout where it has not been rendered yet.
      - path: Resources/AppIcon.icns
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.hudak.macos.IconsMenu
        PRODUCT_NAME: IconsMenu
    info:
      path: Sources/IconsMenu/Info.plist
      properties:
        # The bundle is IconsMenu.app (PRODUCT_NAME), but everything a user reads —
        # the About panel, Login Items, the Accessibility list — comes from these.
        CFBundleName: Icons Menu
        CFBundleDisplayName: Icons Menu
        CFBundleIconFile: AppIcon
        # The About panel reads all three, so they follow the project rather than
        # xcodegen's 1.0/1 defaults.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: © 2026 Miro Hudak
        # Menu-bar-only: no Dock icon, no main menu.
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true

  # Step 0 feasibility probe, kept as the debugging tool for anything AX-related.
  axprobe:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Core
      - path: Sources/axprobe
    settings:
      base:
        PRODUCT_NAME: axprobe
